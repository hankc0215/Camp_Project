name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, github-pages-v1 ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python for rainfall update
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install rainfall dependencies
      run: python -m pip install --upgrade numpy pandas

    - name: Update CWA rainfall data
      env:
        CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
      run: |
        if [ -z "$CWA_API_KEY" ]; then
          echo "CWA_API_KEY secret is not set; deploying existing rainfall files."
          exit 0
        fi
        python scripts/update_rainfall.py
      continue-on-error: true
    
    - name: Setup Pages
      uses: actions/configure-pages@v5
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: '.'
        
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
